<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtue FX Manager — Trial Users Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c15;
      --card-bg: rgba(22, 24, 38, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e4e6eb;
      --text-muted: #8b90a0;
      --accent: #00f2fe;
      --accent-rgb: 0, 242, 254;
      --success: #00e676;
      --danger: #ff5252;
      --font: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
    }

    /* Auth screen container */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 20px;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.15);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #0b0c15;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    /* Main Dashboard Screen */
    #dashboard-screen {
      display: none;
      flex-direction: column;
      padding: 40px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .actions-bar {
      display: flex;
      gap: 12px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: none;
      padding: 10px 20px;
      font-size: 14px;
      width: auto;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--text-muted);
      box-shadow: none;
    }

    .btn-danger {
      background: transparent;
      border: 1px solid rgba(255, 82, 82, 0.3);
      color: var(--danger);
      box-shadow: none;
      padding: 10px 20px;
      font-size: 14px;
      width: auto;
    }

    .btn-danger:hover {
      background: rgba(255, 82, 82, 0.1);
      border-color: var(--danger);
      box-shadow: none;
    }

    /* Stats Cards */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .stat-num {
      font-size: 36px;
      font-weight: 800;
      color: var(--accent);
      margin-top: 5px;
    }

    /* Table & Controls Section */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .controls-row {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      max-width: 350px;
      flex-grow: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }

    td {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .mono {
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-active {
      background: rgba(0, 230, 118, 0.15);
      color: var(--success);
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .badge-expired {
      background: rgba(255, 82, 82, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 82, 82, 0.3);
    }

    /* Error Toast */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 82, 82, 0.9);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      font-size: 14px;
      font-weight: 600;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      #dashboard-screen {
        padding: 20px;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      .controls-row {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="glass-card">
      <div class="logo">VIRTUE AUDIO</div>
      <div class="subtitle">Trial Database Administrator</div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="admin-secret">Admin Secret Key</label>
          <input type="password" id="admin-secret" placeholder="Enter secret token..." required>
        </div>
        <button type="submit" id="btn-login">Connect Dashboard</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-screen">
    <header>
      <div>
        <div class="logo">VIRTUE AUDIO</div>
        <div style="font-size: 14px; color: var(--text-muted)">Trial Management Portal</div>
      </div>
      <div class="actions-bar">
        <button class="btn-secondary" id="btn-refresh">Refresh Data</button>
        <button class="btn-secondary" id="btn-export">Export to CSV</button>
        <button class="btn-danger" id="btn-logout">Disconnect</button>
      </div>
    </header>

    <div class="stats-row">
      <div class="stat-card">
        <label>Total Registered Trials</label>
        <div class="stat-num" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <label>Active Trials</label>
        <div class="stat-num" id="stat-active" style="color: var(--success)">0</div>
      </div>
      <div class="stat-card">
        <label>Expired Trials</label>
        <div class="stat-num" id="stat-expired" style="color: var(--danger)">0</div>
      </div>
    </div>

    <div class="table-container">
      <div class="controls-row">
        <input type="text" class="search-box" id="search-input" placeholder="Search by email or machine hash...">
        <div id="count-label" style="font-size: 13px; color: var(--text-muted)">Showing 0 of 0 records</div>
      </div>
      
      <div style="overflow-x: auto;">
        <table id="trials-table">
          <thead>
            <tr>
              <th>User Email</th>
              <th>Status</th>
              <th>Days Left</th>
              <th>Started Date</th>
              <th>Expiration Date</th>
              <th>Machine Hash</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Loaded dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast">Error message goes here</div>

  <script>
    const API_URL = "https://virtue-licensing-service.virtuecreativesystems.workers.dev/v1/admin/trials";
    let trialsData = [];

    // Check saved auth
    const savedSecret = localStorage.getItem("vfxm_admin_secret");
    if (savedSecret) {
      document.getElementById("admin-secret").value = savedSecret;
      connectDashboard(savedSecret);
    }

    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const secret = document.getElementById("admin-secret").value.trim();
      connectDashboard(secret);
    });

    document.getElementById("btn-refresh").addEventListener("click", () => {
      const secret = localStorage.getItem("vfxm_admin_secret");
      if (secret) connectDashboard(secret);
    });

    document.getElementById("btn-logout").addEventListener("click", () => {
      localStorage.removeItem("vfxm_admin_secret");
      document.getElementById("admin-secret").value = "";
      document.getElementById("dashboard-screen").style.display = "none";
      document.getElementById("auth-screen").style.display = "flex";
      trialsData = [];
    });

    document.getElementById("search-input").addEventListener("input", filterTable);

    document.getElementById("btn-export").addEventListener("click", exportCSV);

    function showToast(msg, duration = 4000) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => {
        t.classList.remove("show");
      }, duration);
    }

    async function connectDashboard(secret) {
      const btn = document.getElementById("btn-login");
      btn.innerText = "Connecting...";
      btn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${secret}`
          }
        });

        if (response.status === 401) {
          showToast("Unauthorized: Invalid secret key.");
          btn.innerText = "Connect Dashboard";
          btn.disabled = false;
          return;
        }

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const data = await response.json();
        if (data.success) {
          localStorage.setItem("vfxm_admin_secret", secret);
          trialsData = data.trials || [];
          
          document.getElementById("auth-screen").style.display = "none";
          document.getElementById("dashboard-screen").style.display = "flex";
          
          renderStats();
          renderTable(trialsData);
        } else {
          showToast("Failed to retrieve trial records.");
        }
      } catch (err) {
        showToast(`Connection Error: ${err.message}`);
      } finally {
        btn.innerText = "Connect Dashboard";
        btn.disabled = false;
      }
    }

    function formatDate(ts) {
      if (!ts) return "-";
      const d = new Date(ts * 1000);
      return d.getFullYear() + "-" + 
             String(d.getMonth() + 1).padStart(2, '0') + "-" + 
             String(d.getDate()).padStart(2, '0') + " " + 
             String(d.getHours()).padStart(2, '0') + ":" + 
             String(d.getMinutes()).padStart(2, '0') + ":" + 
             String(d.getSeconds()).padStart(2, '0');
    }

    function renderStats() {
      const now = Date.now() / 1000;
      let active = 0;
      let expired = 0;

      trialsData.forEach(t => {
        if (t.expires_at > now) active++;
        else expired++;
      });

      document.getElementById("stat-total").innerText = trialsData.length;
      document.getElementById("stat-active").innerText = active;
      document.getElementById("stat-expired").innerText = expired;
    }

    function renderTable(data) {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      const now = Date.now() / 1000;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">No trial records found.</td></tr>`;
        document.getElementById("count-label").innerText = `Showing 0 of ${trialsData.length} records`;
        return;
      }

      data.forEach(t => {
        const isExpired = t.expires_at <= now;
        const daysLeft = isExpired ? 0 : Math.max(0, ((t.expires_at - now) / 86400).toFixed(1));
        
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="font-weight: 600;">${t.email}</td>
          <td>
            <span class="badge ${isExpired ? 'badge-expired' : 'badge-active'}">
              ${isExpired ? 'Expired' : 'Active'}
            </span>
          </td>
          <td class="mono" style="font-weight: 600; color: ${isExpired ? 'var(--danger)' : 'var(--success)'}">${daysLeft}d</td>
          <td class="mono">${formatDate(t.started_at)}</td>
          <td class="mono">${formatDate(t.expires_at)}</td>
          <td class="mono" style="font-size: 11px;" title="${t.machine_hash}">${t.machine_hash.substring(0, 16)}...</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("count-label").innerText = `Showing ${data.length} of ${trialsData.length} records`;
    }

    function filterTable() {
      const query = document.getElementById("search-input").value.toLowerCase().trim();
      if (!query) {
        renderTable(trialsData);
        return;
      }

      const filtered = trialsData.filter(t => {
        return (t.email && t.email.toLowerCase().includes(query)) ||
               (t.machine_hash && t.machine_hash.toLowerCase().includes(query));
      });

      renderTable(filtered);
    }

    function exportCSV() {
      if (trialsData.length === 0) {
        showToast("No data to export.");
        return;
      }

      const headers = ["Email", "Machine Hash", "Started At", "Expires At", "Days Remaining"];
      const now = Date.now() / 1000;

      const rows = trialsData.map(t => {
        const isExpired = t.expires_at <= now;
        const daysLeft = isExpired ? 0 : Math.max(0, ((t.expires_at - now) / 86400).toFixed(1));
        return [
          t.email,
          t.machine_hash,
          formatDate(t.started_at),
          formatDate(t.expires_at),
          daysLeft
        ];
      });

      let csvContent = "data:text/csv;charset=utf-8," 
        + [headers.join(","), ...rows.map(e => e.map(val => `"${val}"`).join(","))].join("\n");

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "virtue_vfxm_trials_" + new Date().toISOString().split('T')[0] + ".csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
